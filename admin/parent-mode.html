<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家长免答题 · 题了个题</title><style>
body{background:#f5f7f2;color:#24372c;font:16px/1.7 system-ui,sans-serif;margin:0}
main{max-width:470px;margin:36px auto;padding:24px;background:white;border-radius:16px;box-shadow:0 3px 20px #0001}
h1{font-size:23px}p{color:#607167}
button,input{font:inherit;border-radius:9px;padding:10px 14px;border:1px solid #b7cbbd}
input{box-sizing:border-box;width:100%;margin-bottom:10px}
button{background:#195e43;color:#fff;cursor:pointer;margin:5px}
.secondary{background:#fff;color:#195e43}
#controls{display:none}#status{font-weight:bold;color:#195e43}
small{color:#68776e}a{color:#195e43}
</style></head><body><main><a href="/admin/">返回家长管理后台</a>
<h1>家长免答题</h1>
<p>启用后，电视不弹题、不扣孩子余额；到期自动恢复。可以提前关闭。</p>
<section id="login"><label>管理密码<input id="password" type="password" autocomplete="current-password"></label><button id="sign-in">验证密码</button></section>
<section id="controls"><p id="status"></p>
<button data-minutes="60">免答题 1 小时</button>
<button data-minutes="120">免答题 2 小时</button>
<button data-minutes="240">免答题 4 小时</button>
<button data-minutes="0" class="secondary">立即恢复管控</button>
<p id="admin-state"></p></section>
<p id="message" role="status"></p>
<small>防卸载需要在电视「家长验证 → 权限设置 → 防卸载」中进行系统授权。</small>
</main><script>
(function(){
var token='',msg=document.getElementById('message'),status=document.getElementById('status');
function call(path,method,data,callback){
 var xhr=new XMLHttpRequest();xhr.open(method,path,true);
 xhr.setRequestHeader('Content-Type','application/json');
 if(token)xhr.setRequestHeader('Authorization','Bearer '+token);
 xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;
 var obj;try{obj=JSON.parse(xhr.responseText)}catch(e){obj={error:'响应格式错误'}}
 if(xhr.status<200||xhr.status>=300||obj.error)return callback(new Error(obj.message||obj.error||'HTTP '+xhr.status));
 callback(null,obj);
 };xhr.send(data?JSON.stringify(data):null);
}
function refresh(){
 call('/api/parent-mode','GET',null,function(err,data){
 if(err){msg.textContent=err.message;return;}
 status.textContent=data.active?'已启用，还剩约 '+Math.ceil(data.remainingSeconds/60)+' 分钟':'当前正常管控';
 document.getElementById('admin-state').textContent='电视防卸载：'+(data.deviceAdminActive?'已授权':'未授权（须电视本机授权）');
 });
}
document.getElementById('sign-in').onclick=function(){
 call('/api/auth','POST',{passphrase:document.getElementById('password').value},function(err,data){
 if(err){msg.textContent=err.message;return;}
 token=data.token;document.getElementById('password').value='';
 document.getElementById('login').style.display='none';
 document.getElementById('controls').style.display='block';
 msg.textContent='';refresh();
 });
};
var buttons=document.querySelectorAll('[data-minutes]');
for(var i=0;i<buttons.length;i++)buttons[i].onclick=function(){
 var n=Number(this.getAttribute('data-minutes'));
 call('/api/parent-mode','POST',{minutes:n},function(err){
 msg.textContent=err?err.message:(n?'已启用，电视自动返回桌面':'已恢复管控');
 if(!err)refresh();
 });
};
})();
</script></body></html>
